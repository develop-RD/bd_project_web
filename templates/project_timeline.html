{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col">
            <div class="header-actions" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Назад
                    </a>
                    <h1 style="display: inline-block; margin-left: 20px;">
                        <i class="fas fa-chart-line"></i> План-график по проектам
                    </h1>
                </div>
            </div>

            <!-- Фильтры -->
            <div class="card" style="margin-bottom: 20px;">
                <div class="card-header">
                    <h3><i class="fas fa-filter"></i> Фильтры</h3>
                </div>
                <div class="card-body">
                    <div class="form-row" style="display: flex; gap: 20px; flex-wrap: wrap;">
                        <div class="form-group" style="flex: 2;">
                            <label>Проект:</label>
                            <select id="selectedProject" class="form-control" style="width: 100%;">
                                <option value="all">-- Все проекты --</option>
                                {% for project in projects %}
                                <option value="{{ project.id }}" style="color: {{ project.color }}">{{ project.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-group" style="flex: 2;">
                            <label>Лаборатория:</label>
                            <select id="selectedLab" class="form-control" style="width: 100%;">
                                <option value="all">-- Все лаборатории --</option>
                                {% for lab in labs %}
                                <option value="{{ lab.id }}">{{ lab.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group" style="flex: 2;">
                            <label>Ответственный:</label>
                            <select id="selectedAssignee" class="form-control" style="width: 100%;">
                                <option value="all">-- Все ответственные --</option>
                                {% for user in all_users %}
                                <option value="{{ user.id }}">{{ user.full_name }} ({{ user.username }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group" style="flex: 1;">
                            <label>Дата от:</label>
                            <input type="date" id="selectedStartDate" class="form-control" value="">
                        </div>
                        
                        <div class="form-group" style="flex: 1;">
                            <label>Дата до:</label>
                            <input type="date" id="selectedEndDate" class="form-control" value="">
                        </div>
                        
                        <div class="form-group" style="flex: 1; display: flex; align-items: flex-end;">
                            <button class="btn btn-primary" onclick="loadTasks()" style="width: 100%;">
                                <i class="fas fa-search"></i> Применить фильтры
                            </button>
                        </div>
                        <div class="form-group" style="flex: 1; display: flex; align-items: flex-end;">
                            <button class="btn btn-secondary" onclick="resetFilters()" style="width: 100%;">
                                <i class="fas fa-undo"></i> Сбросить
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Кнопка добавления задачи -->
            <div style="margin-bottom: 20px;">
                <button class="btn btn-success" onclick="showAddTaskModal()">
                    <i class="fas fa-plus"></i> Добавить задачу
                </button>
                <button class="btn btn-info" onclick="exportToDocx()">
                    <i class="fas fa-file-word"></i> Экспорт в DOCX
                </button>
            </div>

            <!-- Контейнер для задач -->
            <div id="tasksContainer">
                <div class="text-center" style="padding: 40px;">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p>Выберите фильтры для отображения задач</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно для редактирования задачи -->
<div id="taskModal" class="modal">
    <div class="modal-content" style="max-width: 700px;">
        <div class="modal-header">
            <h2 id="taskModalTitle">Добавить задачу</h2>
            <span class="close" onclick="closeTaskModal()">&times;</span>
        </div>
        <div class="modal-body">
            <input type="hidden" id="taskId">
            <input type="hidden" id="parentTaskId">
            
            <div class="form-group">
                <label>Проект:</label>
                <select id="taskProjectId" class="form-control" required>
                    <option value="">-- Выберите проект --</option>
                    {% for project in projects %}
                    <option value="{{ project.id }}" style="color: {{ project.color }}">{{ project.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label>Лаборатория (обязательно):</label>
                <select id="taskLabId" class="form-control" required>
                    <option value="">-- Выберите лабораторию --</option>
                    {% for lab in labs %}
                    <option value="{{ lab.id }}">{{ lab.name }}</option>
                    {% endfor %}
                </select>
                <small>Задача будет добавлена в план-график выбранной лаборатории</small>
            </div>
            
            <div class="form-group">
                <label>Название задачи:</label>
                <input type="text" id="taskName" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label>Описание:</label>
                <textarea id="taskDescription" class="form-control" rows="2"></textarea>
            </div>
            
            <div class="form-row" style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>Дата начала:</label>
                    <input type="date" id="taskStartDate" class="form-control">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Дата окончания:</label>
                    <input type="date" id="taskEndDate" class="form-control">
                </div>
            </div>
            
            <div class="form-group">
                <label>Прогресс (%):</label>
                <input type="number" id="taskProgress" class="form-control" value="0" min="0" max="100">
            </div>
            
            <div class="form-group">
                <label>Приоритет:</label>
                <select id="taskPriority" class="form-control">
                    <option value="low">Низкий</option>
                    <option value="medium" selected>Средний</option>
                    <option value="high">Высокий</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Ответственные (можно выбрать несколько):</label>
                <select id="taskAssignees" class="form-control" multiple size="5">
                    {% for user in all_users %}
                    <option value="{{ user.id }}">{{ user.full_name }} ({{ user.username }})</option>
                    {% endfor %}
                </select>
                <small>Удерживайте Ctrl для выбора нескольких</small>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Отмена</button>
            <button type="button" class="btn btn-danger" id="deleteTaskBtn" onclick="deleteCurrentTask()" style="display: none;">Удалить задачу</button>
            <button type="button" class="btn btn-primary" onclick="saveTask()">Сохранить</button>
        </div>
    </div>
</div>

<script>
// Глобальные переменные
let allTasks = [];
let projectsList = {};
let labsList = {};

// Инициализация списков
{% for project in projects %}
projectsList[{{ project.id }}] = {
    name: "{{ project.name }}",
    color: "{{ project.color }}"
};
{% endfor %}

{% for lab in labs %}
labsList[{{ lab.id }}] = {
    name: "{{ lab.name }}"
};
{% endfor %}

// Загрузка всех задач
function loadAllTasks() {
    const projectId = document.getElementById('selectedProject').value;
    const labId = document.getElementById('selectedLab').value;
    
    let url = `/api/project-timeline/tasks`;
    const params = new URLSearchParams();
    if (projectId && projectId !== 'all') params.append('project_id', projectId);
    if (labId && labId !== 'all') params.append('lab_id', labId);
    
    if (params.toString()) url += '?' + params.toString();
    
    return fetch(url)
        .then(response => response.json())
        .then(tasks => {
            allTasks = tasks;
            return tasks;
        });
}


function deleteCurrentTask() {
    const taskId = document.getElementById('taskId').value;
    if (!taskId) return;
    
    const taskName = document.getElementById('taskName').value;
    if (confirm(`Удалить задачу "${taskName}" и все подзадачи?`)) {
        fetch(`/api/project-plans/tasks/${taskId}`, { method: 'DELETE' })
        .then(() => {
            closeTaskModal();
            loadTasks();
            showNotification('Задача удалена', 'success');
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Ошибка при удалении задачи');
        });
    }
}

// Проверяет, есть ли в задаче или её подзадачах указанный ответственный
function hasAssigneeInTree(task, assigneeId) {
    if (task.assignees && task.assignees.some(a => a.id == assigneeId)) {
        return true;
    }
    if (task.subtasks && task.subtasks.length > 0) {
        return task.subtasks.some(subtask => hasAssigneeInTree(subtask, assigneeId));
    }
    return false;
}

// Проверяет, есть ли в задаче или её подзадачах указанный проект
function hasProjectInTree(task, projectId) {
    // Проверяем текущую задачу
    if (task.project_id == projectId) {
        return true;
    }
    // Проверяем подзадачи
    if (task.subtasks && task.subtasks.length > 0) {
        return task.subtasks.some(subtask => hasProjectInTree(subtask, projectId));
    }
    return false;
}

// Фильтрует дерево задач, сохраняя структуру родитель-подзадача
function filterTaskTree(task, projectId, labId, assigneeId) {
    // Рекурсивно фильтруем подзадачи
    let filteredSubtasks = [];
    if (task.subtasks && task.subtasks.length > 0) {
        filteredSubtasks = task.subtasks
            .map(subtask => filterTaskTree(subtask, projectId, labId, assigneeId))
            .filter(subtask => subtask !== null);
    }
    
    // Проверяем, подходит ли текущая задача под фильтры
    let matchesFilters = true;
    
    // Фильтр по проекту: задача подходит, если её проект совпадает ИЛИ есть подходящие подзадачи
    if (projectId && projectId !== 'all') {
        matchesFilters = matchesFilters && (task.project_id == projectId || filteredSubtasks.length > 0);
    }
    
    // Фильтр по лаборатории
    if (labId && labId !== 'all' && matchesFilters) {
        matchesFilters = matchesFilters && (task.lab_id == labId);
    }
    
    // Фильтр по ответственному
    if (assigneeId && assigneeId !== 'all' && matchesFilters) {
        matchesFilters = matchesFilters && hasAssigneeInTree(task, assigneeId);
    }
    
    // Если задача подходит под фильтры ИЛИ есть подходящие подзадачи, возвращаем задачу с отфильтрованными подзадачами
    if (matchesFilters || filteredSubtasks.length > 0) {
        return {
            ...task,
            subtasks: filteredSubtasks
        };
    }
    
    return null;
}

// Фильтрация задач (сохраняет структуру дерева)
function filterTasks(tasks, projectId, labId, assigneeId) {
    return tasks
        .map(task => filterTaskTree(task, projectId, labId, assigneeId))
        .filter(task => task !== null);
}

// Загрузка задач с фильтрами
function loadTasks() {
    const projectId = document.getElementById('selectedProject').value;
    const labId = document.getElementById('selectedLab').value;
    const assigneeId = document.getElementById('selectedAssignee').value;
    const startDate = document.getElementById('selectedStartDate').value;
    const endDate = document.getElementById('selectedEndDate').value;

    showLoading(true);
    
    loadAllTasks().then(() => {
        // Сначала фильтруем по проекту, лаборатории и ответственному
        let filteredTasks = filterTasks(allTasks, projectId, labId, assigneeId);
        
        // Затем фильтруем по диапазону дат
        if (startDate || endDate) {
            filteredTasks = filterTasksByDateRange(filteredTasks, startDate, endDate);
        }
        
        if (projectId === 'all') {
            renderGroupedByProject(filteredTasks, labId);
        } else {
            renderTasksForProject(filteredTasks, projectId);
        }
        showLoading(false);
    });
}

// Сброс фильтров
function resetFilters() {
    document.getElementById('selectedProject').value = 'all';
    document.getElementById('selectedLab').value = 'all';
    document.getElementById('selectedAssignee').value = 'all';
    document.getElementById('selectedStartDate').value = '';
    document.getElementById('selectedEndDate').value = '';
    loadTasks();
}

// Рендер задач для конкретного проекта
function renderTasksForProject(tasks, projectId) {
    const container = document.getElementById('tasksContainer');
    const projectInfo = projectsList[projectId];
    const projectName = projectInfo?.name || 'Проект';
    const projectColor = projectInfo?.color || '#0366d6';
    
    if (!tasks || tasks.length === 0) {
        container.innerHTML = `...`; // ваш код для пустого состояния
        return;
    }
    
    let html = `
        <div class="card">
            <div class="card-header" style="background-color: ${projectColor}10; border-left: 4px solid ${projectColor};">
                <h3 style="color: ${projectColor};"><i class="fas fa-project-diagram"></i> ${escapeHtml(projectName)}</h3>
                <small>Задач: ${tasks.length}</small>
            </div>
            <div class="card-body">
                <div class="tasks-table-wrapper" style="overflow-x: auto;">
                    <table class="tasks-table">
                        <thead>
                            <tr>
                                <th style="width: 300px;">Название задачи</th>
                                <th style="width: 100px;">Дата начала</th>
                                <th style="width: 100px;">Дата окончания</th>
                                <th style="width: 80px;">Прогресс</th>
                                <th style="width: 100px;">Приоритет</th>
                                <th style="width: 150px;">Ответственные</th>
                                <th style="width: 100px;">Лаборатория</th>
                                <th style="width: 80px;">Примечание</th>
                                <th style="width: 120px;">Действия</th>
                             </thead>
                            <tbody>
    `;
    
    tasks.forEach(task => {
        // Используем рекурсивную функцию для отображения задачи и всех её подзадач
        html += renderTaskWithSubtasks(task, 0);
    });
    
    html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    container.innerHTML = html;

    attachNoteButtonHandlers();
}
// Группировка по проектам
function renderGroupedByProject(tasks, labId) {
    const container = document.getElementById('tasksContainer');
    
    // Группируем задачи по проектам
    const tasksByProject = {};
    
    tasks.forEach(task => {
        const projectId = task.project_id;
        if (!tasksByProject[projectId]) {
            tasksByProject[projectId] = {
                project_id: projectId,
                project_name: projectsList[projectId]?.name || 'Без проекта',
                project_color: projectsList[projectId]?.color || '#6c757d',
                tasks: []
            };
        }
        tasksByProject[projectId].tasks.push(task);
    });
    
    const sortedProjects = Object.values(tasksByProject).sort((a, b) => 
        a.project_name.localeCompare(b.project_name)
    );
    
    if (sortedProjects.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-tasks fa-3x"></i>
                <p>Нет задач, соответствующих фильтрам</p>
            </div>
        `;
        return;
    }
    
    let html = '';
    
    sortedProjects.forEach(project => {
        html += `
            <div class="card project-group" style="margin-bottom: 20px;">
                <div class="card-header" style="background-color: ${project.project_color}10; border-left: 4px solid ${project.project_color};">
                    <h3 style="color: ${project.project_color};"><i class="fas fa-project-diagram"></i> ${escapeHtml(project.project_name)}</h3>
                    <small>Задач: ${project.tasks.length}</small>
                </div>
                <div class="card-body">
                    <div class="tasks-table-wrapper" style="overflow-x: auto;">
                        <table class="tasks-table">
                            <thead>
                                <tr>
                                    <th style="width: 300px;">Название задачи</th>
                                    <th style="width: 100px;">Дата начала</th>
                                    <th style="width: 100px;">Дата окончания</th>
                                    <th style="width: 80px;">Прогресс</th>
                                    <th style="width: 100px;">Приоритет</th>
                                    <th style="width: 150px;">Ответственные</th>
                                    <th style="width: 100px;">Лаборатория</th>
                                    <th style="width: 80px;">Примечание</th>
                                    <th style="width: 120px;">Действия</th>
                                 </thead>
                                <tbody>
        `;
        
        project.tasks.forEach(task => {
            html += renderTaskWithSubtasks(task, 0);
        });
        
        html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;

    attachNoteButtonHandlers();
}

// Рекурсивный рендер задачи с подзадачами
function renderTaskWithSubtasks(task, level) {
    let html = renderTaskRow(task, level);
    
    if (task.subtasks && task.subtasks.length > 0) {
        task.subtasks.forEach(subtask => {
            html += renderTaskWithSubtasks(subtask, level + 1);
        });
    }
    
    return html;
}

// Поиск задачи по id во всём дереве allTasks
function findTaskById(taskId, tasks = allTasks) {
    for (const task of tasks) {
        if (task.id === taskId) return task;
        if (task.subtasks && task.subtasks.length) {
            const found = findTaskById(taskId, task.subtasks);
            if (found) return found;
        }
    }
    return null;
}

function handleNoteButtonClick(event) {
    event.stopPropagation();
    const button = event.currentTarget;
    const taskId = parseInt(button.dataset.taskId);
    
    // Находим задачу в глобальном массиве allTasks
    const task = findTaskById(taskId);
    if (!task) {
        console.error('Task not found:', taskId);
        return;
    }
    
    const note = task.note || '';
    showNoteModal(taskId, note);
}

// Привязка обработчиков ко всем кнопкам примечаний
function attachNoteButtonHandlers() {
    document.querySelectorAll('.note-button').forEach(button => {
        // Удаляем старый обработчик, чтобы не дублировать
        button.removeEventListener('click', handleNoteButtonClick);
        // Добавляем новый
        button.addEventListener('click', handleNoteButtonClick);
    });
}

// Создание HTML строки для задачи
function renderTaskRow(task, level) {
    const isTaskOverdue = task.end_date && task.end_date < getTodayDate() && task.progress < 100;
    const isTaskCompleted = task.progress >= 100;
    
    function formatDate(dateStr) {
        if (!dateStr) return '—';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }
    
    const startDate = task.start_date ? formatDate(task.start_date) : '—';
    let endDateHtml = '';
    if (!task.end_date) {
        endDateHtml = '—';
    } else if (isTaskOverdue) {
        endDateHtml = `<span style="color: #c62828; font-weight: bold;">${formatDate(task.end_date)} ⚠️</span>`;
    } else if (isTaskCompleted) {
        endDateHtml = `<span style="color: #2e7d32; font-weight: bold;">${formatDate(task.end_date)} ✓</span>`;
    } else {
        endDateHtml = formatDate(task.end_date);
    }
    
    const progressColor = isTaskCompleted ? '#4caf50' : (task.progress > 0 ? '#2196f3' : '#f0f0f0');
    const progressHtml = `
        <div style="display: flex; align-items: center; gap: 8px;">
            <div class="progress-bar" style="width: 80px; background: #f0f0f0; border-radius: 10px; overflow: hidden;">
                <div style="width: ${task.progress}%; height: 10px; background: ${progressColor}; border-radius: 10px;"></div>
            </div>
            <span>${task.progress}%</span>
        </div>
    `;
    
    const priorityNames = {'low': 'Низкий', 'medium': 'Средний', 'high': 'Высокий'};
    const priorityColors = {'low': '#5bc0de', 'medium': '#f0ad4e', 'high': '#d9534f'};
    const priorityHtml = `<span style="display: inline-block; padding: 2px 8px; background: ${priorityColors[task.priority]}; color: white; border-radius: 12px; font-size: 11px;">${priorityNames[task.priority]}</span>`;
    
    let assigneesHtml = '<span style="color: #999;">—</span>';
    if (task.assignees && task.assignees.length > 0) {
        assigneesHtml = task.assignees.map(a => `<span class="badge">${escapeHtml(a.name)}</span>`).join(' ');
    }
    
    // Лаборатория с цветным бейджем
    const labHtml = task.lab_id ? 
        `<span class="lab-badge" style="display: inline-block; padding: 4px 8px; background: #e3f2fd; color: #1565c0; border-radius: 12px; font-size: 11px; font-weight: 500;">
            <i class="fas fa-flask"></i> ${escapeHtml(task.lab_name)}
        </span>` : 
        '<span style="color: #999;">—</span>';
    
    // ИСПРАВЛЕННЫЕ КНОПКИ ПРИМЕЧАНИЙ
    let noteHtml = '';
    if (task.note) {
        noteHtml = `<button type="button" class="btn btn-info btn-sm note-button" data-task-id="${task.id}" title="Просмотреть примечание" style="cursor: pointer;">
            <img src="../static/prim.png" width="25" height="15">
        </button>`;
    } else {
        noteHtml = `<button type="button" class="btn btn-secondary btn-sm note-button" data-task-id="${task.id}" title="Добавить примечание" style="cursor: pointer;">
           <img src="../static/plus.jpg" width="15" height="15">
        </button>`;
    }
    
    
    const hasSubtasks = task.subtasks && task.subtasks.length > 0;
    const iconClass = hasSubtasks ? '<img src="../static/folder.jpg" width="15" height="15" margin-top: 2px>' : '<img src="../static/file.png" width="15" height="15" margin-top: 2px>';
    return `
        <tr>
            <td style="padding-left: ${20 + level * 20}px;">
                <div style="display: flex; align-items: flex-start; gap: 8px;">
                   ${iconClass}
                    <div>
                        <strong>${escapeHtml(task.name)}</strong>
                        ${task.description ? `<br><small style="color: #999;">${escapeHtml(task.description.substring(0, 80))}</small>` : ''}
                    </div>
                </div>
              </td>
            <td>${startDate}</td>
            <td>${endDateHtml}</td>
            <td>${progressHtml}</td>
            <td>${priorityHtml}</td>
            <td>${assigneesHtml}</td>
            <td>${labHtml}</td>
            <td style="text-align: center;">${noteHtml}</td>
            <td>
                <button type="button" class="btn btn-sm" onclick="editTask(${task.id})" title="Редактировать">
                    <img src="../static/rework.png" width="15" height="15">
                </button>
                <button type="button" class="btn btn-sm" onclick="deleteTaskConfirm(${task.id}, '${escapeHtml(task.name).replace(/'/g, "\\'")}')" title="Удалить" style="margin-left: 5px;">
                   <img src="../static/delete.png" width="15" height="15">
                </button>
            </td>
          </tr>
    `;
}

function getTodayDate() {
    const today = new Date();
    return today.toISOString().split('T')[0];
}

function showLoading(show) {
    const container = document.getElementById('tasksContainer');
    if (show) {
        container.innerHTML = `
            <div class="text-center" style="padding: 40px;">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p>Загрузка...</p>
            </div>
        `;
    }
}

function showAddTaskModal() {
    document.getElementById('taskModalTitle').textContent = 'Добавить задачу';
    document.getElementById('taskId').value = '';
    document.getElementById('parentTaskId').value = '';
    document.getElementById('taskProjectId').value = document.getElementById('selectedProject').value === 'all' ? '' : document.getElementById('selectedProject').value;
    document.getElementById('taskLabId').value = '';
    document.getElementById('taskName').value = '';
    document.getElementById('taskDescription').value = '';
    document.getElementById('taskStartDate').value = '';
    document.getElementById('taskEndDate').value = '';
    document.getElementById('taskProgress').value = '0';
    document.getElementById('taskPriority').value = 'medium';
    
    const assigneeSelect = document.getElementById('taskAssignees');
    for (let i = 0; i < assigneeSelect.options.length; i++) {
        assigneeSelect.options[i].selected = false;
    }
    
    document.getElementById('taskModal').style.display = 'block';
    document.getElementById('deleteTaskBtn').style.display = 'none';
}

function saveTask() {
    const taskId = document.getElementById('taskId').value;
    const isEdit = taskId && taskId !== '';
    
    const taskData = {
        name: document.getElementById('taskName').value,
        description: document.getElementById('taskDescription').value,
        project_id: parseInt(document.getElementById('taskProjectId').value),
        start_date: document.getElementById('taskStartDate').value || null,
        end_date: document.getElementById('taskEndDate').value || null,
        progress: parseInt(document.getElementById('taskProgress').value),
        priority: document.getElementById('taskPriority').value,
        assignees: Array.from(document.getElementById('taskAssignees').selectedOptions).map(opt => parseInt(opt.value))
    };
    
    if (!taskData.name) {
        alert('Введите название задачи');
        return;
    }
    
    if (!taskData.project_id) {
        alert('Выберите проект');
        return;
    }
    
    let url, method;
    
    if (isEdit) {
        // Редактирование существующей задачи
        url = `/api/project-plans/tasks/${taskId}`;
        method = 'PUT';
    } else {
        // Создание новой задачи
        taskData.lab_id = parseInt(document.getElementById('taskLabId').value);
        taskData.parent_id = document.getElementById('parentTaskId').value || null;
        
        if (!taskData.lab_id) {
            alert('Выберите лабораторию');
            return;
        }
        
        url = '/api/project-timeline/tasks';
        method = 'POST';
    }
    
    fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(taskData)
    })
    .then(response => response.json())
    .then(result => {
        if (result.status === 'success') {
            closeTaskModal();
            loadTasks();
            showNotification(isEdit ? 'Задача успешно обновлена!' : 'Задача успешно создана!', 'success');
        } else {
            alert('Ошибка при сохранении задачи: ' + (result.message || 'неизвестная ошибка'));
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Ошибка при сохранении задачи');
    });
}

function showNotification(message, type) {
    const notification = document.createElement('div');
    notification.className = `notification notification-${type}`;
    notification.textContent = message;
    notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 20px;
        background-color: ${type === 'success' ? '#d4edda' : '#f8d7da'};
        color: ${type === 'success' ? '#155724' : '#721c24'};
        border: 1px solid ${type === 'success' ? '#c3e6cb' : '#f5c6cb'};
        border-radius: 4px;
        z-index: 10000;
        animation: slideIn 0.3s ease;
    `;
    
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => {
            if (notification.parentNode) notification.remove();
        }, 300);
    }, 3000);
}

function deleteTaskConfirm(taskId, taskName) {
    if (confirm(`Удалить задачу "${taskName}" и все подзадачи?`)) {
        fetch(`/api/project-plans/tasks/${taskId}`, { method: 'DELETE' })
        .then(() => {
            loadTasks();
            showNotification('Задача удалена', 'success');
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Ошибка при удалении задачи');
        });
    }
}

function editTask(taskId) {
    fetch(`/api/project-plans/tasks/${taskId}`)
        .then(response => response.json())
        .then(task => {
            document.getElementById('taskModalTitle').textContent = 'Редактировать задачу';
            document.getElementById('taskId').value = task.id;
            document.getElementById('parentTaskId').value = task.parent_id || '';
            document.getElementById('taskProjectId').value = task.project_id;
            
            // Нужно получить lab_id из задачи (через план)
            fetch(`/api/project-timeline/task/${taskId}/lab`)
                .then(response => response.json())
                .then(labData => {
                    document.getElementById('taskLabId').value = labData.lab_id || '';
                })
                .catch(() => {
                    document.getElementById('taskLabId').value = '';
                });
            
            document.getElementById('taskName').value = task.name;
            document.getElementById('taskDescription').value = task.description || '';
            document.getElementById('taskStartDate').value = task.start_date || '';
            document.getElementById('taskEndDate').value = task.end_date || '';
            document.getElementById('taskProgress').value = task.progress || 0;
            document.getElementById('taskPriority').value = task.priority || 'medium';
            
            const assigneeSelect = document.getElementById('taskAssignees');
            for (let i = 0; i < assigneeSelect.options.length; i++) {
                assigneeSelect.options[i].selected = task.assignees && 
                    task.assignees.some(a => a.id == assigneeSelect.options[i].value);
            }
            
            document.getElementById('taskModal').style.display = 'block';
        });

        document.getElementById('deleteTaskBtn').style.display = 'inline-block';
}

function closeTaskModal() {
    document.getElementById('taskModal').style.display = 'none';
}

// Примечания
let currentNoteTaskId = null;

function showNoteModal(taskId, note) {
    console.log('Opening note modal for task:', taskId);
    currentNoteTaskId = taskId;
    const textarea = document.getElementById('taskNote');
    if (!textarea) {
        console.error('Textarea not found');
        return;
    }
    
    // Устанавливаем значение (если note null/undefined, ставим пустую строку)
    textarea.value = note || '';
    
    // Показываем модальное окно
    const modal = document.getElementById('noteModal');
    if (modal) {
        modal.style.display = 'block';
    }
    
    // Устанавливаем фокус
    setTimeout(() => {
        textarea.focus();
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
    }, 100);
}

function saveNoteAndClose(successMessage = 'Примечание сохранено') {
    const note = document.getElementById('taskNote').value;
    
    if (!currentNoteTaskId) {
        console.error('No task selected for note');
        showNotification('Ошибка: не выбрана задача', 'error');
        return;
    }
    
    // Отключаем кнопки, чтобы избежать повторных вызовов
    const saveBtn = document.querySelector('#noteModal .btn-primary');
    const closeBtn = document.querySelector('#noteModal .btn-secondary');
    if (saveBtn) saveBtn.disabled = true;
    if (closeBtn) closeBtn.disabled = true;
    
    fetch(`/api/project-plans/tasks/${currentNoteTaskId}/note`, {
        method: 'PUT',
        headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify({ note: note })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
    })
    .then(result => {
        if (result.status === 'success') {
            // Закрываем модальное окно
            closeNoteModal();
            // Обновляем таблицу
            loadTasks();
            // Показываем уведомление
            showNotification(successMessage, 'success');
        } else {
            throw new Error(result.message || 'Неизвестная ошибка');
        }
    })
    .catch(error => {
        console.error('Error saving note:', error);
        showNotification('Ошибка при сохранении примечания: ' + error.message, 'error');
        // Не закрываем модальное окно при ошибке
    })
    .finally(() => {
        // Включаем кнопки обратно
        if (saveBtn) saveBtn.disabled = false;
        if (closeBtn) closeBtn.disabled = false;
    });
}

// Функция для сохранения (для кнопки)
function saveNote() {
    saveNoteAndClose('Примечание сохранено');
}

// Обработчик клавиши Enter в поле примечания
function handleNoteKeydown(event) {
    if (event.key === 'Enter') {
        if (event.shiftKey) {
            // Shift+Enter -允许 перенос строки (ничего не делаем, пусть браузер добавляет новую строку)
            return;
        } else {
            // Enter без Shift - сохраняем
            event.preventDefault();
            saveNoteAndClose('Примечание сохранено');
        }
    }
}

function closeNoteModal() {
    const modal = document.getElementById('noteModal');
    if (modal) {
        modal.style.display = 'none';
    }
    currentNoteTaskId = null;
}

// Закрытие по Escape
function handleEscapeKey(event) {
    if (event.key === 'Escape') {
        const modal = document.getElementById('noteModal');
        if (modal && modal.style.display === 'block') {
            closeNoteModal();
        }
    }
}

// Настройка модального окна примечаний
function setupNoteModal() {
    // Удаляем старый обработчик, если есть
    document.removeEventListener('keydown', handleEscapeKey);
    document.addEventListener('keydown', handleEscapeKey);
    
    // Настраиваем текстовое поле
    const textarea = document.getElementById('taskNote');
    if (textarea) {
        // Удаляем старый обработчик
        textarea.removeEventListener('keydown', handleNoteKeydown);
        // Добавляем новый
        textarea.addEventListener('keydown', handleNoteKeydown);
    }
    
    // Закрытие при клике на фон
    const modal = document.getElementById('noteModal');
    if (modal) {
        modal.onclick = function(event) {
            if (event.target === modal) {
                closeNoteModal();
            }
        };
    }
}

function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Экспорт в DOCX с учётом текущих фильтров
function exportToDocx() {
    const projectId = document.getElementById('selectedProject').value;
    const labId = document.getElementById('selectedLab').value;
    const assigneeId = document.getElementById('selectedAssignee').value;
    const startDate = document.getElementById('selectedStartDate').value;
    const endDate = document.getElementById('selectedEndDate').value;
    
    // Строим URL с параметрами
    const params = new URLSearchParams();
    if (projectId && projectId !== 'all') params.append('project_id', projectId);
    if (labId && labId !== 'all') params.append('lab_id', labId);
    if (assigneeId && assigneeId !== 'all') params.append('assignee_id', assigneeId);
    if (startDate) params.append('start_date', startDate);
    if (endDate) params.append('end_date', endDate);
    
    const url = `/api/project-timeline/export/docx${params.toString() ? '?' + params.toString() : ''}`;
    
    // пока проблема с отображением, надо будет разобраться
    //showLoading(true);
    
    fetch(url)
        .then(response => {
            if (!response.ok) {
                throw new Error('Ошибка при экспорте');
            }
            return response.blob();
        })
        .then(blob => {
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            
            const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
            a.download = `План-график_по_проектам_${timestamp}.docx`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(downloadUrl);
            
            showLoading(false);
            showNotification('Экспорт успешно завершён!', 'success');
        })
        .catch(error => {
            console.error('Error exporting:', error);
            showLoading(false);
            showNotification('Ошибка при экспорте', 'error');
        });
}


// Функция фильтрации задач по диапазону дат
function filterTasksByDateRange(tasks, startDate, endDate) {
    if (!startDate && !endDate) return tasks;
    
    function taskMatchesDate(task) {
        const taskStart = task.start_date;
        const taskEnd = task.end_date;
        
        // Если нет дат, задача не подходит под фильтр (если фильтр активен)
        if (!taskStart && !taskEnd) return false;
        
        let matches = true;
        
        if (startDate) {
            const start = new Date(startDate);
            const taskEndDate = taskEnd ? new Date(taskEnd) : null;
            if (taskEndDate && taskEndDate < start) matches = false;
            if (!taskEndDate && taskStart) {
                const taskStartDate = new Date(taskStart);
                if (taskStartDate < start) matches = false;
            }
        }
        
        if (endDate && matches) {
            const end = new Date(endDate);
            const taskStartDate = taskStart ? new Date(taskStart) : null;
            if (taskStartDate && taskStartDate > end) matches = false;
            if (!taskStartDate && taskEnd) {
                const taskEndDate = new Date(taskEnd);
                if (taskEndDate > end) matches = false;
            }
        }
        
        return matches;
    }
    
    function filterTree(task) {
        let filteredSubtasks = [];
        if (task.subtasks && task.subtasks.length > 0) {
            filteredSubtasks = task.subtasks
                .map(sub => filterTree(sub))
                .filter(sub => sub !== null);
        }
        
        const matches = taskMatchesDate(task);
        
        if (matches || filteredSubtasks.length > 0) {
            return {
                ...task,
                subtasks: filteredSubtasks
            };
        }
        
        return null;
    }
    
    return tasks.map(task => filterTree(task)).filter(task => task !== null);
}

// Добавляем модальное окно для примечаний в конец body
document.addEventListener('DOMContentLoaded', () => {
    // Добавляем модальное окно для примечаний, если его нет
    if (!document.getElementById('noteModal')) {
        const noteModalHtml = `
            <div id="noteModal" class="modal">

                        <h2><i class="fas fa-sticky-note"></i> Примечание</h2>

                    </div>
                    <div class="modal-body">
                        <textarea id="taskNote" class="form-control" rows="5" placeholder="Введите примечание к задаче...&#10;&#10;Совет: нажмите Enter для сохранения, Shift+Enter для переноса строки"></textarea>
                        <small style="display: block; margin-top: 8px; color: #666;">
                            <i class="fas fa-info-circle"></i> Нажмите <kbd>Enter</kbd> для сохранения, <kbd>Shift</kbd>+<kbd>Enter</kbd> для переноса строки
                        </small>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeNoteModal()">Отмена</button>
                        <button type="button" class="btn btn-primary" onclick="saveNote()">Сохранить</button>

            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', noteModalHtml);
    }
    
    // Настраиваем модальное окно
    setupNoteModal();
    
    // Загружаем задачи
    loadTasks();
});
